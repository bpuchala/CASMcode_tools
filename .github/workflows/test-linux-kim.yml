name: Testing on ubuntu-latest with KIM

on:
  push:
  pull_request:
  schedule:
    - cron: '0 12 * * 0'

env:
  SKBUILD_BUILD_OPTIONS: --verbose

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Set up micromamba and KIM API environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: kim-env
          create-args: -c conda-forge kim-api kimpy lammps
          init-shell: bash

      - name: Install KIM potential and configure environment
        shell: bash -el {0}
        run: |
          kim-api-collections-management install user MEAM_LAMMPS_KimJeonLee_2015_MgCa__MO_611309973581_002
          echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib:${LD_LIBRARY_PATH}" >> $GITHUB_ENV

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install build-essential cmake
          pip install --upgrade -r build_requirements.txt

      - name: make
        shell: bash
        run: |
          pip install .

      - name: Install test requirements & set configuration variables
        run: |
          pip install -r test_requirements.txt

      - name: test
        shell: bash
        run: |
          python -m pytest -rsap -x -m "not requires_ase and not requires_kim" tests

      - name: make with ase
        shell: bash
        run: |
          pip install ".[ase]"

      - name: test with requires_ase
        shell: bash
        run: |
          python -m pytest -rsap -x -m "requires_ase and not requires_kim" tests

      - name: test with requires_kim
        shell: bash
        run: |
          python -m pytest -rsap -x -m "requires_kim" tests
